<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dead Reckoning Board</title>
<style>
:root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --fg:#e6e8ec; --mute:#8b93a3; --ok:#3ecf8e; --bad:#ff6b6b; --warn:#f5b942; --dr:#6aa9ff; --nv:#c792ea; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
header h1 { font-size:16px; margin:0 12px 0 0; }
header .sub { color:var(--mute); font-size:12px; margin-right:auto; }
button { background:#232834; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; font:inherit; }
button:hover { border-color:var(--dr); }
button.danger { border-color:#5a2a2a; } button.danger:hover { border-color:var(--bad); }
input { background:#11141a; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; width:150px; font:inherit; }
main { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:12px 16px; }
@media (max-width: 900px) { main { grid-template-columns:1fr; } }
section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; min-width:0; }
section h2 { margin:0 0 4px; font-size:15px; display:flex; gap:8px; align-items:center; }
.dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
.meta { color:var(--mute); font-size:12px; overflow-wrap:anywhere; }
.verdict { display:inline-block; padding:2px 8px; border-radius:999px; font-weight:600; font-size:12px; }
.VALID { background:rgba(62,207,142,.15); color:var(--ok); } .INVALID { background:rgba(255,107,107,.15); color:var(--bad); } .BLOCKED { background:rgba(245,185,66,.15); color:var(--warn); }
table { width:100%; border-collapse:collapse; margin-top:8px; font-size:12px; }
td, th { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); overflow-wrap:anywhere; }
th { color:var(--mute); font-weight:500; }
.tag { font-size:11px; padding:1px 6px; border-radius:4px; background:#23324a; color:#9cc3ff; }
.rej { color:var(--bad); }
.bars { margin-top:10px; }
.bar { display:grid; grid-template-columns:110px 1fr 48px; gap:8px; align-items:center; font-size:12px; margin:3px 0; }
.bar .track { background:#11141a; border-radius:4px; height:12px; overflow:hidden; }
.bar .fill { height:100%; border-radius:4px; }
.log { margin-top:10px; font:11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color:#b8c0cc; max-height:260px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; background:#11141a; border-radius:6px; padding:8px; }
.fact { margin-top:8px; font-size:12px; }
footer { color:var(--mute); font-size:11px; padding:0 16px 16px; }
</style>
</head>
<body>
<header>
  <h1>Dead Reckoning</h1>
  <span class="sub">Angel Island · Oct 9–11 · party 2 · $400 · wheelchair-accessible campsite · live SSE from control <span id="conn">…</span></span>
  <input id="tok" type="password" placeholder="operator token" autocomplete="off">
  <button onclick="op('reset')">Reset world</button>
  <button onclick="op('start',{arm:'both',crash:true})">Start both</button>
  <button class="danger" onclick="op('kill')">kill -9 held</button>
  <button onclick="op('world',{site:'site-A',status:'closed',notice:'Storm damage'})">Close Site A</button>
  <button onclick="op('resume')">Resume</button>
</header>
<main>
  <section id="dr"></section>
  <section id="naive"></section>
</main>
<footer>Fallback/proof panel served by control at /board (the integrated surface is the OpenBot chat). Token bars: planner input tokens per call (metrics.context_tokens), DR budget 6000.</footer>
<script>
const ARMS = { dr: { name: "Dead Reckoning", color: "var(--dr)" }, naive: { name: "Naive transcript-resume baseline", color: "var(--nv)" } };
const S = {};
function fresh(arm, run_id) { return { run_id, pid: null, state: "-", verdict: null, receipts: {}, factA: null, tokens: [], logs: [], hold: null }; }
function A(arm, run_id) { if (!S[arm] || (run_id && S[arm].run_id !== run_id)) S[arm] = fresh(arm, run_id); return S[arm]; }
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const INTERESTING = /RESTORING|control cache|reconcile|marked stale|OBSERVE|LIQUID|PLANNER|DESK|VERDICT|HOLDING|STEP|NAIVE|ERROR|kill -9|spawned|exited/;

function onEvent(e) {
  if (e.type === "snapshot") { for (const m of e.data.missions || []) { const a = A(m.arm, m.run_id); Object.assign(a, { pid: m.pid, state: m.state, verdict: m.verdict, hold: m.hold_line }); } return; }
  if (!e.arm) return;
  const a = A(e.arm, e.run_id);
  const d = e.data || {};
  if (e.type === "worker") {
    if (d.state === "spawned") { a.pid = d.pid; a.state = "running"; a.hold = null; }
    if (d.state === "holding") { a.state = "holding"; a.hold = d.line; }
    if (d.state === "exited") a.state = d.signal === "SIGKILL" ? "killed (SIGKILL)" : d.code === 0 ? "done" : "failed";
    if (d.kind === "verdict") a.verdict = d;
  } else if (e.type === "row" && e.table === "receipts") {
    a.receipts[d.receipt_id] = d;
  } else if (e.type === "row" && e.table === "facts" && d.key === "site-A.status") {
    a.factA = d;
  } else if (e.type === "metric" && d.phase === "planner") {
    a.tokens.push({ label: `${d.step} · e${d.epoch}`, n: Number(d.context_tokens) });
  } else if (e.type === "log" && INTERESTING.test(d.line || "")) {
    a.logs.push(d.line); if (a.logs.length > 60) a.logs.shift();
  }
  schedule();
}
let pending = false;
function schedule() { if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; render(); }); } }
function render() {
  const max = Math.max(1, ...Object.values(S).flatMap((a) => a.tokens.map((t) => t.n)));
  for (const arm of ["dr", "naive"]) {
    const el = document.getElementById(arm); const a = S[arm]; const cfg = ARMS[arm];
    if (!a) { el.innerHTML = `<h2><span class="dot" style="background:${cfg.color}"></span>${cfg.name}</h2><div class="meta">no run yet</div>`; continue; }
    const rc = Object.values(a.receipts);
    const f = a.factA;
    el.innerHTML = `
      <h2><span class="dot" style="background:${cfg.color}"></span>${cfg.name} ${a.verdict ? `<span class="verdict ${esc(a.verdict.verdict)}">${esc(a.verdict.verdict)}</span>` : ""}</h2>
      <div class="meta">run ${esc(a.run_id)} · pid ${esc(a.pid)} · ${esc(a.state)}</div>
      ${a.hold ? `<div class="meta" style="color:var(--warn)">${esc(a.hold)}</div>` : ""}
      ${a.verdict ? `<div class="meta">${esc(a.verdict.reason)} · duplicate_effects ${esc(a.verdict.duplicate_effects)} · stale_actions ${esc(a.verdict.stale_actions)}</div>` : ""}
      <table><tr><th>slot</th><th>resource</th><th>outcome</th><th>receipt</th></tr>
      ${rc.map((r) => `<tr><td>${esc(r.slot)}</td><td>${esc(r.resource)}</td><td class="${r.outcome === "rejected" ? "rej" : ""}">${esc(r.outcome)}${r.reject_reason ? ` (${esc(r.reject_reason)})` : ""}</td><td>${esc(r.receipt_id)} ${r.recovered === true || r.recovered === "true" ? '<span class="tag">RECOVERED FROM DESK</span>' : ""}</td></tr>`).join("") || '<tr><td colspan="4" class="meta">no receipts yet</td></tr>'}
      </table>
      ${f ? `<div class="fact">site-A.status = <b>${esc(JSON.parse(f.value))}</b> <span class="meta">(${esc(f.status)}${f.nimble_request_id ? ` · task ${esc(f.nimble_request_id)}` : ""}${f.world_version ? ` · world v${esc(f.world_version)}` : ""})</span></div>` : ""}
      <div class="bars">${a.tokens.map((t) => `<div class="bar"><span class="meta">${esc(t.label)}</span><div class="track"><div class="fill" style="width:${(100 * t.n) / max}%;background:${cfg.color}"></div></div><span>${t.n}</span></div>`).join("")}</div>
      <div class="log">${a.logs.slice(-30).map(esc).join("\n")}</div>`;
    const lg = el.querySelector(".log"); if (lg) lg.scrollTop = lg.scrollHeight;
  }
}
async function op(path, body) {
  const t = document.getElementById("tok").value.trim();
  try { localStorage.setItem("dr-op", t); } catch {}
  const r = await fetch(`/demo/${path}`, { method: "POST", headers: { authorization: `Bearer ${t}`, "content-type": "application/json" }, body: JSON.stringify(body || {}) });
  if (!r.ok) alert(`${path}: HTTP ${r.status}`);
}
try { document.getElementById("tok").value = localStorage.getItem("dr-op") || ""; } catch {}
const es = new EventSource("/events");
es.onopen = () => (document.getElementById("conn").textContent = "● connected");
es.onerror = () => (document.getElementById("conn").textContent = "○ reconnecting");
for (const t of ["snapshot", "row", "worker", "metric", "log"]) es.addEventListener(t, (m) => onEvent(JSON.parse(m.data)));
render();
</script>
</body>
</html>
